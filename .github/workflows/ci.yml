name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Check code style and formatting
  lint-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff Linter
        continue-on-error: true
        run: ruff check src tests config

      - name: Check formatting with Black
        continue-on-error: true
        run: black --check src tests config

  # Job 2: Run unit tests (ClickHouse not required)
  run-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-mock

      - name: Run Unit Tests
        env:
          # Tell scripts we are running in CI / allow bypass
          CI: "true"
          ALLOW_LOCAL_RUN: "1"
          LLM_PROVIDER: openai
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gemini-1.5-flash' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          python -m pytest tests/test_amc_design_patterns.py tests/test_hdfc_importer.py tests/test_dsp_importer.py tests/test_fund_imports_integration.py tests/test_smallcap_pattern_analyzer.py -v
          python tests/test_tools.py
          python tests/test_quant_signals.py
          python tests/test_news_sentiment.py
          python tests/test_cache.py
          python tests/test_inav_cli.py
          python tests/test_macro_theme_agent.py

  # Job 3: Verify Docker image compiles successfully
  verify-docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Verify)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mosaic-fund-agent:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
