name: inav-snapshots

# Capture NSE iNAV snapshots every 15 min during Indian market hours.
# NSE hours: 09:15-15:30 IST  =  03:45-10:00 UTC (Mon-Fri).
# GitHub Actions scheduled runs are best-effort — occasional delays are normal.

on:
  schedule:
    # Every 5 min from 03:00-10:59 UTC, Mon-Fri.
    # Script re-checks IST market hours and skips out-of-hours ticks.
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: inav-snapshots
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install httpx pandas pydantic pydantic-settings

      - name: Capture iNAV snapshots
        run: python scripts/capture_inav_snapshots.py

      - name: Commit new snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain market_data/inav/)" ]; then
            echo "No new snapshots to commit."
            exit 0
          fi
          git add market_data/inav/
          git commit -m "chore(inav): snapshot $(date -u +'%Y-%m-%dT%H:%M UTC')"
          git push
