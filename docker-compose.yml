services:

  # ── Ollama — local LLM inference server ──────────────────────────────────────
  # Serves gemma4 (and any other pulled models) on port 11434.
  # Models are stored in the ollama-models named volume so they survive restarts.
  #
  # macOS note: Docker runs in a Linux VM — Metal/MPS is NOT available.
  # Inference uses CPU only inside the container (~10-20 tok/s on M-series).
  # For faster results on macOS, run Ollama on the host instead (see .env comments).
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    # Uncomment for NVIDIA GPU on Linux:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── One-time model initialiser ───────────────────────────────────────────────
  # Pulls gemma4:latest into the ollama service and creates the mosaic-gemma4
  # variant from ollama/Modelfile (num_ctx=16384, temperature=0). Also pulls
  # nomic-embed-text, used by src/ml/correlation/news_rag.py for RAG embeddings
  # regardless of LLM_PROVIDER/LLM_BASE_URL (which route chat only).
  # FIRST RUN: downloads ~5-8 GB — runs once, then the volume cache is reused.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./ollama:/modelfiles:ro
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull nomic-embed-text &&
       echo 'nomic-embed-text ready'"
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    ports:
      - "8123:8123"   # HTTP interface (used by clickhouse-connect)
      - "9000:9000"   # Native TCP interface
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-backups:/backups
      - ./config/clickhouse:/etc/clickhouse-server/config.d
    environment:
      CLICKHOUSE_DB: market_data
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build: .
    image: mosaic-fund-agent
    entrypoint: ["streamlit", "run", "src/ui/app.py",
                 "--server.address=0.0.0.0",
                 "--server.port=8501",
                 "--server.headless=true"]
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      QDRANT_HOST: qdrant
      # nomic-embed-text embeddings (news RAG) always go through Ollama,
      # independent of LLM_PROVIDER/LLM_BASE_URL (which route chat only).
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./tests:/app/tests
      - ./output:/app/output   # bind mount — host files visible instantly
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      clickhouse:
        condition: service_healthy
      qdrant:
        condition: service_started

  mosaic:
    build: .
    image: mosaic-fund-agent

    # Load all API keys from the .env file on the host.
    # The file is NEVER copied into the image — it stays on your machine.
    env_file: .env

    environment:
      # Suppress webbrowser.open() — the HTML file is still generated inside
      # the mosaic-output named volume at /app/output.
      NO_BROWSER: "1"
      # Reports + disk cache + LLM cache all live inside the named volume.
      OUTPUT_DIR: /app/output
      # Connect to the ClickHouse service defined above
      CLICKHOUSE_HOST: clickhouse
      QDRANT_HOST: qdrant
      # nomic-embed-text embeddings (news RAG) always go through Ollama,
      # independent of LLM_PROVIDER/LLM_BASE_URL (which route chat only).
      OLLAMA_HOST: http://ollama:11434

    volumes:
      # Bind mount — reports/cache on host are visible inside container immediately.
      - ./output:/app/output
      - ./src:/app/src
      - ./config:/app/config
      - ./tests:/app/tests
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      clickhouse:
        condition: service_healthy
      qdrant:
        condition: service_started

    # ENTRYPOINT is fixed to `python src/main.py` in the Dockerfile.
    # Override the default CMD per call:
    #
    #   Demo (no API keys needed):
    #     docker compose run mosaic analyze --demo
    #
    #   Live portfolio analysis:
    #     docker compose run mosaic analyze
    #
    #   Import 2 years of historical data (first run):
    #     docker compose run mosaic import
    #
    #   Delta sync (only new data since last import):
    #     docker compose run mosaic import
    #
    #   Import specific categories:
    #     docker compose run mosaic import --category stocks,etfs
    #
    #   Ask the AI agent a question:
    #     docker compose run mosaic ask "what is my riskiest holding?"
    #
    #   COMEX pre-market commodity signals:
    #     docker compose run mosaic comex
    #
    #   News sentiment for a symbol:
    #     docker compose run mosaic news RELIANCE --company "Reliance Industries"
    #
    #   Regenerate HTML dashboard from the latest saved report:
    #     docker compose run mosaic dashboard
    #
    #   Show active configuration (sensitive fields masked):
    #     docker compose run mosaic config

  # ── Live Multi-Symbol Anomaly + News-Correlation Monitor ────────────────────
  # Long-running process: watches NSE indices/holdings via Shoonya websocket
  # (NSE→Yahoo polling fallback) through the trading session and pushes Slack
  # alerts. Opt-in via `profiles` so it never starts on a bare
  # `docker compose up` — start it explicitly:
  #   docker compose up -d live-monitor         (detached, survives terminal close)
  #   docker compose run --rm -it live-monitor --dry-run
  #   docker compose run --rm -it live-monitor --check-session-only
  # or via the wrapper: ./mosaic.sh live-monitor [-d|--dry-run|--check-session-only]
  live-monitor:
    build: .
    image: mosaic-fund-agent
    profiles: ["live-monitor"]
    entrypoint: ["python", "src/agents/live_monitor.py"]
    command: ["--watchlist-config", "config/live_watchlist.yaml"]
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      QDRANT_HOST: qdrant
    volumes:
      - ./output:/app/output
      - ./src:/app/src
      - ./config:/app/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      qdrant:
        condition: service_started

  # ── Report file server ───────────────────────────────────────────────────────
  # Serves /app/output/reports/ at http://localhost:8502 with directory listing.
  # Open in any browser to browse and download PDFs, HTML, and Markdown reports.
  files:
    image: python:3.11-slim
    command: python -m http.server 8502 --directory /app/output/reports
    ports:
      - "8502:8502"
    volumes:
      - ./output:/app/output
  # Temporarily removed from compose (2026-07-01) — see git history to restore.
  # Was: serves the visual AI research workspace at http://localhost:8502,
  # built via the studio-builder stage in the Dockerfile.

  # ── Qdrant Vector Database ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # HTTP REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  clickhouse-data:
  clickhouse-backups:
  ollama-models:    # gemma4 weights — persists across restarts (~5-8 GB)
  qdrant-data:      # qdrant vector data store
